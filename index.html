<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorManía</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logos">
            <span class = "logo-blanco">Flor</span><span>Manía</span>
        </div>
        <div class="menu-header">
            <a href="#" class="enlace" id="enlace-envia-flores">Envía Flores</a>
            <a href="#">Nosotros</a>
            <button class="btn-sesion" id="btn-sesion">Iniciar Sesión</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#">Girasoles</a></li>
            <li><a href="#">Rosas</a></li>
            <li><a href="#">Claveles</a></li>
            <li><a href="#">Tulipanes</a></li>
            <li><a href="#">Lirios</a></li>
            <li><a href="#">Orquídeas</a></li>
            <li><a href="#">Margaritas</a></li>
        </ul>
    </nav>

    <main>
        <h1 class="titulo-seccion">Flor del Mes</h1>
        <div class="banner">
            <img src="images/flor-del-mes.jpg" alt="Flor del Mes">
        </div>

        <div class="resultados-header">
            <p>Mostrando <span>50 resultados</span></p>
            <a href="#" class="ver-mas">Ver más Flores</a>
        </div>

        <div class="tarjetas">
            <figure class="tarjeta">
                <img src="images/ramo-de-rosas.jpg" alt="Ramo de Rosas">
                <div class="tarjeta-inferior">
                    <div class="detalles-tarjeta">
                        <p class="nombre">Ramo de Rosas</p>
                        <p class="precio">$40.00</p>
                    </div>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </figure>

            <figure class="tarjeta">
                <img src="images/arreglo-tulipanes.jpg" alt="Arreglo Tulipanes">
                <div class="tarjeta-inferior">
                    <div class="detalles-tarjeta">
                        <p class="nombre">Arreglo Tulipanes</p>
                        <p class="precio">$50.00</p>
                    </div>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </figure>

            <figure class="tarjeta">
                <img src="images/bouquet-lirios.jpg" alt="Bouquet Lirios">
                <div class="tarjeta-inferior">
                    <div class="detalles-tarjeta">
                        <p class="nombre">Bouquet Lirios</p>
                        <p class="precio">$25.00</p>
                    </div>
                    <button class="btn-comprar">Comprar</button>
                </div>
                    
            </figure>
        </div>
    </main>

    <footer>
    </footer>
</body>

</html>
